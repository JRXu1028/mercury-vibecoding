name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm --prefix frontend install
      - run: npm run build:desktop

      - name: Build macOS dmg+zip
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            release/*.dmg
            release/*.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm --prefix frontend install
      - run: npm run build:desktop

      - name: Build Windows nsis
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: release/*.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mac-builds
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: win-builds
          path: release/

      - name: List release files
        run: ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## Mercury Vibecoding ${{ github.ref_name }}

            ### 下载

            | 平台 | 文件 | 安装方式 |
            |------|------|----------|
            | macOS (Apple Silicon) | `.dmg` | 双击打开 → 拖入 Applications |
            | macOS (Apple Silicon) | `.zip` | 解压 → 双击 `.app` |
            | Windows | `.exe` | 双击运行安装向导 |

            ### macOS 首次打开

            若提示"无法验证开发者"：右键点击应用 → "打开" → 确认

            ### 使用方法

            1. 启动后点击 **+ Add Feed** 输入 RSS URL
            2. 左侧选订阅源，中间选文章，右侧阅读
            3. 工具栏切换 AI Provider (Mock / DeepSeek / OpenAI-Compatible)
            4. DeepSeek 需设环境变量：`export DEEPSEEK_API_KEY=your-key` 后启动
            5. OpenAI-Compatible 需设环境变量：`export OPENAI_COMPATIBLE_API_KEY=your-key` 后启动
