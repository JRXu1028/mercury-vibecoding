name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
              release/*.dmg.blockmap
              release/*.zip.blockmap
            artifact_name: mac
          - os: windows-latest
            target: win
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
            artifact_name: win
          - os: ubuntu-latest
            target: linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
            artifact_name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build & package
        run: npm run dist:${{ matrix.target }}
        env:
          # Skip code signing (no Apple/Windows certs in this project)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Disable macOS notarization
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          # Prevent electron-builder from auto-publishing; release job handles it
          GH_TOKEN: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release-out
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-out/ \;
          ls -lh release-out/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
